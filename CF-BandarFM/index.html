<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bandar FM</title>

    <meta name="description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta name="google" content="notranslate">
    <link rel="icon" type="image/png" href="logo-512.png">
    <meta name="keywords" content="Bandar FM, BandarFM, Bandar Radio">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Bandar FM">
    <meta property="og:description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="fontawesome/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #08080d;
            color: #111;
        }
        
        .dotcom {
            font-size: 0.25em;
            letter-spacing: 0;
            vertical-align: baseline;
            margin-left: 4px;
            font-weight: 700;
        }

        /* Creative radio-wave background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    #252033 0%,
                    #0d0c13 45%,
                    #050508 100%
                );
        }

        .glow {
            position: absolute;
            width: 55vw;
            height: 55vw;
            min-width: 450px;
            min-height: 450px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.035) 35%,
                    transparent 70%
                );
        }

        .wave {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 5s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            width: 35vw;
            height: 35vw;
        }

        .wave:nth-child(3) {
            width: 55vw;
            height: 55vw;
            animation-delay: 1s;
        }

        .wave:nth-child(4) {
            width: 75vw;
            height: 75vw;
            animation-delay: 2s;
        }

        .wave:nth-child(5) {
            width: 95vw;
            height: 95vw;
            animation-delay: 3s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.15;
                transform: translate(-50%, -50%) scale(0.96);
            }

            50% {
                opacity: 0.45;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Background dots */
        .dots {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(
                    rgba(255, 255, 255, 0.16) 1px,
                    transparent 1px
                );
            background-size: 34px 34px;
            opacity: 0.16;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            padding-top: 15vh;
            justify-content: center;
            padding-left: 25px;
            padding-right: 25px;
        }

        .card {
            width: min(620px, 94vw);
            padding: 65px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .radio-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: #111;
            color: white;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 0.95;
            letter-spacing: -3px;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .description {
            max-width: 500px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.65;
            color: #555;
        }

        .description strong {
            color: #111;
        }

        .line {
            width: 70px;
            height: 4px;
            margin: 30px auto 0;
            background: #111;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 50px 25px;
                border-radius: 22px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .description {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <!-- Creative radio-wave background -->
    <div class="background" aria-hidden="true">
        <div class="dots"></div>
        <div class="glow"></div>

        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <!-- Indexable page content -->
    <main class="content">
        <section class="card">
            
                <img src="logo-512.png" alt="Bandar FM Logo" style="width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 28px;">

            <h1>Bandar FM<span class="dotcom">.com</span></h1>

            <p class="description">
                The first web FM in
                <strong>Machilipatnam (Bandar)</strong>.
                Start listening and enjoy! Pure entertainment...
            </p>

            <div class="line"></div>

        </section>
    </main>

</body>
</html>
