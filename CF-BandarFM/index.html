<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bandar FM</title>

    <meta name="description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta name="google" content="notranslate">
    <link rel="icon" type="image/png" href="logo-512.png">
    <meta name="keywords" content="Bandar FM, BandarFM, Bandar Radio">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Bandar FM">
    <meta property="og:description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="fontawesome/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #08080d;
            color: #111;
        }
        
        .dotcom {
            font-size: 0.25em;
            letter-spacing: 0;
            vertical-align: baseline;
            margin-left: 4px;
            font-weight: 700;
        }

        /* Creative radio-wave background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    #252033 0%,
                    #0d0c13 45%,
                    #050508 100%
                );
        }

        .glow {
            position: absolute;
            width: 55vw;
            height: 55vw;
            min-width: 450px;
            min-height: 450px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.035) 35%,
                    transparent 70%
                );
        }

        .wave {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 5s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            width: 35vw;
            height: 35vw;
        }

        .wave:nth-child(3) {
            width: 55vw;
            height: 55vw;
            animation-delay: 1s;
        }

        .wave:nth-child(4) {
            width: 75vw;
            height: 75vw;
            animation-delay: 2s;
        }

        .wave:nth-child(5) {
            width: 95vw;
            height: 95vw;
            animation-delay: 3s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.15;
                transform: translate(-50%, -50%) scale(0.96);
            }

            50% {
                opacity: 0.45;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Background dots */
        .dots {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(
                    rgba(255, 255, 255, 0.16) 1px,
                    transparent 1px
                );
            background-size: 34px 34px;
            opacity: 0.16;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            padding-top: 10vh;
            justify-content: center;
            padding-left: 25px;
            padding-right: 25px;
        }

        .card {
            width: min(620px, 94vw);
            padding: 65px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
        }

        .radio-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: #111;
            color: white;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 0.95;
            letter-spacing: -3px;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .description {
            max-width: 500px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.65;
            color: #555;
        }

        .description strong {
            color: #111;
        }

        .line {
            width: 70px;
            height: 4px;
            margin: 30px auto 0;
            background: #111;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 50px 25px;
                border-radius: 22px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .description {
                font-size: 17px;
            }
        }
        
        /* Bottom player controls */
        .player-controls {
            position: fixed;
            left: 50%;
            bottom: 8vh;
            transform: translateX(-50%);
            z-index: 20;

            display: grid;
            grid-template-columns: 50px 50px 50px 50px 50px;
            column-gap: 20px;

            justify-items: center;
            align-items: center;
        }

        .player-btn {
            width: 50px;
            height: 50px;
            font-size: 17px;
            
            border: none;
            border-radius: 50%;

            background: #fff;
            color: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
                        
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }

        .player-btn.play-btn {
            width: 50px;
            height: 50px;
            font-size: 17px;
        }

        /* Top row */
        
        #reloadBtn {
            grid-column: 1;
            grid-row: 1;
        }
        
        #rewindBtn {
            grid-column: 2;
            grid-row: 1;
        }

        #playBtn {
            grid-column: 3;
            grid-row: 1;
        }

        #forwardBtn {
            grid-column: 4;
            grid-row: 1;
        }
        
        #shareBtn {
            grid-column: 5;
            grid-row: 1;
        }
        
    </style>
</head>

<body>

    <!-- Creative radio-wave background -->
    <div class="background" aria-hidden="true">
        <div class="dots"></div>
        <div class="glow"></div>

        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <!-- Indexable page content -->
    <main class="content">
        <section class="card">
            
                <img src="logo-512.png" alt="Bandar FM Logo" style="width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 28px;">

            <h1>Bandar FM<span class="dotcom">.com</span></h1>

            <p class="description">
                The first web FM in
                <strong>Machilipatnam (Bandar)</strong>.
                Start listening and enjoy! Pure entertainment...
            </p>

            <div class="line"></div>
            
            <p><br>Listen to the latest episode!<br>Next on 14/09/26 (Monday)</p>

        </section>
    </main>
    
    <!-- Native Audio Player -->
<audio id="radioPlayer" loop preload="auto">
    <source src="https://okafm.com/test/nuvve.mp3" type="audio/mpeg">
</audio>

<!-- Bottom Player Controls -->
<div class="player-controls">
    
    <!-- Reload / Restart -->
    <button class="player-btn" id="reloadBtn" aria-label="Restart">
        <i class="fa-solid fa-rotate-right"></i>
    </button>

    <!-- Rewind 15 seconds -->
    <button class="player-btn" id="rewindBtn" aria-label="Rewind 15 seconds">
        <i class="fa-solid fa-backward"></i>
    </button>

    <!-- Play / Pause -->
    <button class="player-btn play-btn" id="playBtn" aria-label="Play">
        <i class="fa-solid fa-play"></i>
    </button>

    <!-- Forward 15 seconds -->
    <button class="player-btn" id="forwardBtn" aria-label="Forward 15 seconds">
        <i class="fa-solid fa-forward"></i>
    </button>
    
    <!-- Share -->
    <button class="player-btn" id="shareBtn" aria-label="Share">
        <i class="fa-solid fa-share-nodes"></i>
    </button>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    /* Initialize native audio */
    const audio = document.getElementById('radioPlayer');

    const reloadBtn = document.getElementById('reloadBtn');
    const playBtn = document.getElementById('playBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const shareBtn = document.getElementById('shareBtn');

    /* Play / Pause */

    async function togglePlay() {

        if (audio.paused) {
            try {
                await audio.play();
            } catch (error) {
                console.error('Audio could not play:', error);
            }
        } else {
            audio.pause();
        }

    }

    playBtn.addEventListener('click', togglePlay);


    /* Rewind 15 seconds */

    function rewind15() {

        audio.currentTime = Math.max(
            0,
            audio.currentTime - 15
        );

    }


    /* Forward 15 seconds */

    function forward15() {

        const duration = audio.duration;

        audio.currentTime = isFinite(duration)
            ? Math.min(duration, audio.currentTime + 15)
            : audio.currentTime + 15;

    }


    /* Connect webpage buttons */
    
    reloadBtn.addEventListener('click', reloadAudio);
    rewindBtn.addEventListener('click', rewind15);
    forwardBtn.addEventListener('click', forward15);
    shareBtn.addEventListener('click', sharePage);
    

    /* Keep Play/Pause icon synced with ACTUAL audio state */

    function updatePlayIcon() {

        if (audio.paused) {
            playBtn.innerHTML =
                '<i class="fa-solid fa-play"></i>';

            playBtn.setAttribute('aria-label', 'Play');

        } else {
            playBtn.innerHTML =
                '<i class="fa-solid fa-pause"></i>';

            playBtn.setAttribute('aria-label', 'Pause');
        }

    }
    
    audio.addEventListener('waiting', () => {
        playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    });

    audio.addEventListener('playing', updatePlayIcon);
    audio.addEventListener('play', updatePlayIcon);
    audio.addEventListener('pause', updatePlayIcon);
    audio.addEventListener('ended', updatePlayIcon);
    
    /* Set initial icon */
    updatePlayIcon();


    /* Media Session / Lock Screen / Notification Controls */

    if ('mediaSession' in navigator) {
        
        navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Bandar FM',
        artist: 'Machilipatnam',
        album: 'Web Radio',
        artwork: [{ src: 'logo-512.png', sizes: '512x512', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', async () => {
            try {
                await audio.play();
            } catch (error) {
                console.error('Media Session play failed:', error);
            }
        });


        navigator.mediaSession.setActionHandler('pause', () => {
            audio.pause();
        });


        /* Lock screen / notification rewind = 15 seconds */
        navigator.mediaSession.setActionHandler(
            'seekbackward',
            (details) => {

                const seconds = 15;

                audio.currentTime = Math.max(
                    0,
                    audio.currentTime - seconds
                );
            }
        );


        /* Lock screen / notification forward = 15 seconds */
        navigator.mediaSession.setActionHandler(
            'seekforward',
            (details) => {

                const seconds = 15;

                const duration = audio.duration;

                audio.currentTime = isFinite(duration)
                    ? Math.min(
                        duration,
                        audio.currentTime + seconds
                    )
                    : audio.currentTime + seconds;
            }
        );
        
        navigator.mediaSession.setActionHandler('previoustrack', () => {
            rewind15();
        });

        navigator.mediaSession.setActionHandler('nexttrack', () => {
            forward15();
        });


        /* Sync Media Session playback state */

        audio.addEventListener('play', () => {
            navigator.mediaSession.playbackState = 'playing';
        });

        audio.addEventListener('pause', () => {
            navigator.mediaSession.playbackState = 'paused';
        });
        
        audio.addEventListener('ended', () => {
            navigator.mediaSession.playbackState = 'none';
        });

    }
    
    function reloadAudio() {
    audio.currentTime = 0;
    audio.play();
}
    
    async function sharePage() {

        const shareData = {
            title: 'Bandar FM',
            url: 'https://bandarfm.com'
        };

        try {

            // Use native Web Share API if available
            if (navigator.share) {
                await navigator.share(shareData);
                return;
            }

            // Fallback: copy link
            await navigator.clipboard.writeText(shareData.url);
            alert('Link copied');

        } catch (error) {

            // If native sharing failed, try clipboard
            try {
                await navigator.clipboard.writeText(shareData.url);
                alert('Link copied');
            } catch (clipboardError) {
                console.error('Share and clipboard failed:', clipboardError);
            }

        }
    }

});
    
</script>
    
</body>
</html>
