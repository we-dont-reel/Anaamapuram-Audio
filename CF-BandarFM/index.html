<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bandar FM</title>

    <meta name="description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta name="google" content="notranslate">
    <link rel="icon" type="image/png" href="logo-512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="keywords" content="Bandar FM, BandarFM, Bandar Radio">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Bandar FM">
    <meta property="og:description" content="The first web FM in Machilipatnam (Bandar). Start listening and enjoy! Pure entertainment...">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="fontawesome/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #08080d;
            color: #111;
        }
        
        .dotcom {
            font-size: 0.25em;
            letter-spacing: 0;
            vertical-align: baseline;
            margin-left: 4px;
            font-weight: 700;
        }

        /* Creative radio-wave background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 50%,
                    #252033 0%,
                    #0d0c13 45%,
                    #050508 100%
                );
        }

        .glow {
            position: absolute;
            width: 55vw;
            height: 55vw;
            min-width: 450px;
            min-height: 450px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.035) 35%,
                    transparent 70%
                );
        }

        .wave {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 5s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            width: 35vw;
            height: 35vw;
        }

        .wave:nth-child(3) {
            width: 55vw;
            height: 55vw;
            animation-delay: 1s;
        }

        .wave:nth-child(4) {
            width: 75vw;
            height: 75vw;
            animation-delay: 2s;
        }

        .wave:nth-child(5) {
            width: 95vw;
            height: 95vw;
            animation-delay: 3s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.15;
                transform: translate(-50%, -50%) scale(0.96);
            }

            50% {
                opacity: 0.45;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Background dots */
        .dots {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(
                    rgba(255, 255, 255, 0.16) 1px,
                    transparent 1px
                );
            background-size: 34px 34px;
            opacity: 0.16;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            padding-top: 10vh;
            justify-content: center;
            padding-left: 25px;
            padding-right: 25px;
        }

        .card {
            position: relative;
            width: min(620px, 94vw);
            padding: 65px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
        }

        .radio-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: #111;
            color: white;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 0.95;
            letter-spacing: -3px;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .description {
            max-width: 500px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.65;
            color: #555;
        }

        .description strong {
            color: #111;
        }

        .line {
            width: 70px;
            height: 4px;
            margin: 30px auto 0;
            background: #111;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 50px 25px;
                border-radius: 22px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .description {
                font-size: 17px;
            }
        }
        
        /* Bottom player controls */
        .player-controls {
            position: fixed;
            left: 50%;
            bottom: 8vh;
            transform: translateX(-50%);
            z-index: 20;

            display: grid;
            grid-template-columns: 50px 50px 50px 50px 50px;
            column-gap: 20px;

            justify-items: center;
            align-items: center;
        }

        .player-btn {
            width: 50px;
            height: 50px;
            font-size: 17px;
            
            border: none;
            border-radius: 50%;

            background: #fff;
            color: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
                        
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }

        .player-btn.play-btn {
            width: 50px;
            height: 50px;
            font-size: 17px;
        }

        /* Top row */
        
        #reloadBtn {
            grid-column: 1;
            grid-row: 1;
        }
        
        #rewindBtn {
            grid-column: 2;
            grid-row: 1;
        }

        #playBtn {
            grid-column: 3;
            grid-row: 1;
        }

        #forwardBtn {
            grid-column: 4;
            grid-row: 1;
        }
        
        #shareBtn {
            grid-column: 5;
            grid-row: 1;
        }
        
        .install-banner {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;

            display: none;
            align-items: center;

            height: 30px;

            background: transparent;
            color: #fff;

            white-space: nowrap;
        }

        .install-banner span {
                font-size: 12px;
                font-weight: 500;
        }

        .install-banner button {
                height: 30px;
                margin-left: 8px;
                padding: 0 11px;

                border: none;
                border-radius: 999px;

                background: #fff;
                color: #111;

                font-size: 14px;
                font-weight: 600;

                cursor: pointer;

                -webkit-tap-highlight-color: transparent;
                tap-highlight-color: transparent;
        }

         .install-banner button:focus {
                outline: none;
        }
        
        .credits-button {
            position: absolute;
            right: 45px;
            bottom: 10px;
            padding: 3px 9px;
            background: #f80350;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 999px;
            font-size: 10px;
            line-height: 1.2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        
        .credits-button:hover,
        .credits-button:focus,
        .credits-button:active {
            background: #f80350;
            color: #fff;
            outline: none;
            box-shadow: none;
            transform: none;
        }
        
        .credits-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(0, 0, 0, 0.85);
        }

        .credits-modal-box {
            width: min(420px, 90vw);
            padding: 25px;
            background: rgba(10, 10, 15, 0.98);
            border-radius: 16px;
            text-align: center;
            color: #fff;
            font-weight: bold;
        }

        .credits-modal-text {
            white-space: pre-line;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .credits-modal-buttons {
            display: flex;
            justify-content: center;
            gap: 60px;
        }

        .credits-modal-button {
            padding: 8px 16px;
            border: none;
            border-radius: 999px;
            background: #f80350;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }

        .credits-modal-button:hover,
        .credits-modal-button:focus,
        .credits-modal-button:active {
            background: #f80350;
            color: #fff;
            outline: none;
            box-shadow: none;
        }

    </style>
</head>

<body>
    
    <div id="installBanner" class="install-banner">
        <span>You can install this now!</span>
        <button id="installBtn" type="button">Install</button>
    </div>

    <!-- Creative radio-wave background -->
    <div class="background" aria-hidden="true">
        <div class="dots"></div>
        <div class="glow"></div>

        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <!-- Indexable page content -->
    <main class="content">
        <section class="card">
            
                <img src="logo-512.png" alt="Bandar FM Logo" style="width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 28px;">

            <h1>Bandar FM<span class="dotcom">.com</span></h1>

            <p class="description">
                The first web FM in
                <strong>Machilipatnam (Bandar)</strong>.
                Start listening and enjoy! Pure entertainment...
            </p>

            <div class="line"></div>
            
            <p><br>Listen to the latest episode!<br>Next on 27/09/26 (Sunday)</p>
            
            <button class="credits-button">Credits</button>

        </section>
    </main>
    
    <!-- Native Audio Player -->
<audio id="radioPlayer" loop preload="auto">
    <source src="https://okafm.com/prod/e5-5.mp3" type="audio/mpeg">
</audio>

<!-- Bottom Player Controls -->
<div class="player-controls">
    
    <!-- Reload / Restart -->
    <button class="player-btn" id="reloadBtn" aria-label="Restart">
        <i class="fa-solid fa-right-left"></i>
    </button>

    <!-- Rewind 15 seconds -->
    <button class="player-btn" id="rewindBtn" aria-label="Rewind 15 seconds">
        <i class="fa-solid fa-backward"></i>
    </button>

    <!-- Play / Pause -->
    <button class="player-btn play-btn" id="playBtn" aria-label="Play">
        <i class="fa-solid fa-play"></i>
    </button>

    <!-- Forward 15 seconds -->
    <button class="player-btn" id="forwardBtn" aria-label="Forward 15 seconds">
        <i class="fa-solid fa-forward"></i>
    </button>
    
    <!-- Share -->
    <button class="player-btn" id="shareBtn" aria-label="Share">
        <i class="fa-solid fa-share-nodes"></i>
    </button>

</div>
    
<div id="creditModal" class="credits-modal">
    <div class="credits-modal-box">
        <div id="creditModalText" class="credits-modal-text"></div>
        <div class="credits-modal-buttons">
            <button id="creditCloseBtn" class="credits-modal-button" type="button">Close</button>
        </div>
    </div>
</div>

<div id="creditLinkModal" class="credits-modal">
    <div class="credits-modal-box">
        <div id="creditLinkModalText" class="credits-modal-text"></div>
        <div class="credits-modal-buttons">
            <a id="creditOpenBtn" class="credits-modal-button" href="" target="_blank" rel="noopener">Open</a>
            <button id="creditLinkCloseBtn" class="credits-modal-button" type="button">Close</button>
        </div>
    </div>
</div>

<script>
    
window.trackTimestamps = [
                { time: "0:00", creditText: "Medisetti Yogeswara Rao,\nRetd. Chief Engineer (ONGC),\nMachilipatnam\nప్రవృత్తి: కవిత్వం", creditLink: "" },
                { time: "2:30", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" },
                { time: "6:49", creditText: "(Research and Writer)\nSri Savaram Venkateswara Rao,\nRetd. Professor,\nThe Hindu College, MTM", creditLink: "" },
                { time: "17:16", creditText: "Dr. G. Tejaswi", creditLink: "https://www.facebook.com/tejaswi.guthikonda" },
                { time: "21:49", creditText: "YouTube\nJayasindoor Entertainments", creditLink: "https://www.youtube.com/watch?v=pd4ScE39LL4" },
                { time: "1:07:15", creditText: "YouTube\nMRT Music", creditLink: "https://www.youtube.com/watch?v=Z4xjFRt1ssI" },
                { time: "1:11:06", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" },
                { time: "1:13:50", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" },
                { time: "1:17:33", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" },
                { time: "1:21:46", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" },
                { time: "1:25:36", creditText: "Bandar FM\n(bandarfm.com)", creditLink: "" }

            ];
    
document.addEventListener('DOMContentLoaded', () => {

    /* Initialize native audio */
    const audio = document.getElementById('radioPlayer');

    const reloadBtn = document.getElementById('reloadBtn');
    const playBtn = document.getElementById('playBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const shareBtn = document.getElementById('shareBtn');
    const creditModal = document.getElementById('creditModal');
    const creditModalText = document.getElementById('creditModalText');
    const creditCloseBtn = document.getElementById('creditCloseBtn');
    const creditLinkModal = document.getElementById('creditLinkModal');
    const creditLinkModalText = document.getElementById('creditLinkModalText');
    const creditOpenBtn = document.getElementById('creditOpenBtn');
    const creditLinkCloseBtn = document.getElementById('creditLinkCloseBtn');
    let creditLink = '';

    /* Play / Pause */

    async function togglePlay() {

        if (audio.paused) {
            try {
                await audio.play();
            } catch (error) {
                console.error('Audio could not play:', error);
            }
        } else {
            audio.pause();
        }

    }

    playBtn.addEventListener('click', togglePlay);


    /* Rewind 15 seconds */

    function rewind15() {

        audio.currentTime = Math.max(
            0,
            audio.currentTime - 15
        );

    }


    /* Forward 15 seconds */

    function forward15() {

        const duration = audio.duration;

        audio.currentTime = isFinite(duration)
            ? Math.min(duration, audio.currentTime + 15)
            : audio.currentTime + 15;

    }


    /* Connect webpage buttons */
    
    reloadBtn.addEventListener('click', reloadAudio);
    rewindBtn.addEventListener('click', rewind15);
    forwardBtn.addEventListener('click', forward15);
    shareBtn.addEventListener('click', sharePage);
    const creditsBtn = document.querySelector('.credits-button');
    creditsBtn.addEventListener('click', showCredits);
    

    /* Keep Play/Pause icon synced with ACTUAL audio state */

    function updatePlayIcon() {

        if (audio.paused) {
            playBtn.innerHTML =
                '<i class="fa-solid fa-play"></i>';

            playBtn.setAttribute('aria-label', 'Play');

        } else {
            playBtn.innerHTML =
                '<i class="fa-solid fa-pause"></i>';

            playBtn.setAttribute('aria-label', 'Pause');
        }

    }
    
    audio.addEventListener('waiting', () => {
        
        if (!navigator.onLine) {
            audio.pause();
            updatePlayIcon();
            alert("Something went wrong. Please check your internet connection and try again.");
            return;
        }
        playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    });
    
    audio.addEventListener('error', () => {
        audio.pause();
        updatePlayIcon();
        alert("Something went wrong. Please check your internet connection and try again.");
    });

    audio.addEventListener('stalled', () => {
        audio.pause();
        updatePlayIcon();
        alert("Something went wrong. Please check your internet connection and try again.");
    });

    audio.addEventListener('playing', updatePlayIcon);
    audio.addEventListener('play', updatePlayIcon);
    audio.addEventListener('pause', updatePlayIcon);
    audio.addEventListener('ended', updatePlayIcon);
    
    /* Set initial icon */
    updatePlayIcon();


    /* Media Session / Lock Screen / Notification Controls */

    if ('mediaSession' in navigator) {
        
        navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Bandar FM',
        artist: 'Machilipatnam',
        album: 'Web Radio',
        artwork: [{ src: 'logo-512.png', sizes: '512x512', type: 'image/png' }]
        });

        navigator.mediaSession.setActionHandler('play', async () => {
            try {
                await audio.play();
            } catch (error) {
                console.error('Media Session play failed:', error);
            }
        });


        navigator.mediaSession.setActionHandler('pause', () => {
            audio.pause();
        });


        /* Lock screen / notification rewind = 15 seconds */
        navigator.mediaSession.setActionHandler(
            'seekbackward',
            (details) => {

                const seconds = 15;

                audio.currentTime = Math.max(
                    0,
                    audio.currentTime - seconds
                );
            }
        );


        /* Lock screen / notification forward = 15 seconds */
        navigator.mediaSession.setActionHandler(
            'seekforward',
            (details) => {

                const seconds = 15;

                const duration = audio.duration;

                audio.currentTime = isFinite(duration)
                    ? Math.min(
                        duration,
                        audio.currentTime + seconds
                    )
                    : audio.currentTime + seconds;
            }
        );
        
        navigator.mediaSession.setActionHandler('previoustrack', () => {
            rewind15();
        });

        navigator.mediaSession.setActionHandler('nexttrack', () => {
            forward15();
        });


        /* Sync Media Session playback state */

        audio.addEventListener('play', () => {
            navigator.mediaSession.playbackState = 'playing';
        });

        audio.addEventListener('pause', () => {
            navigator.mediaSession.playbackState = 'paused';
        });
        
        audio.addEventListener('ended', () => {
            navigator.mediaSession.playbackState = 'none';
        });

    }
    
    function reloadAudio() {
    
        const songStarts = window.trackTimestamps.map(track => track.time);

        const currentTime = audio.currentTime;

        if (!isFinite(currentTime) || currentTime < 0) {
            return;
        }

        let currentIndex = -1;

        for (let i = 0; i < songStarts.length; i++) {
            const parts = songStarts[i].split(':').map(Number);
            const timestamp = parts.length === 3 
                ? parts[0] * 3600 + parts[1] * 60 + parts[2] 
                : parts[0] * 60 + parts[1];

            if (timestamp < currentTime) {
                currentIndex = i;
            }
        }

        if (currentIndex >= songStarts.length - 1) {
            currentIndex = -1;
        }

        const parts = songStarts[currentIndex + 1].split(':').map(Number);
        const previousStart = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];

        audio.currentTime = Math.max(0, previousStart);
        audio.play();
        }
    
    async function sharePage() {

        const shareData = {
            title: 'Bandar FM',
            url: 'https://bandarfm.com'
        };

        try {

            // Use native Web Share API if available
            if (navigator.share) {
                await navigator.share(shareData);
                return;
            }

            // Fallback: copy link
            await navigator.clipboard.writeText(shareData.url);
            alert('Link copied');

        } catch (error) {

            // If native sharing failed, try clipboard
            try {
                await navigator.clipboard.writeText(shareData.url);
                alert('Link copied');
            } catch (clipboardError) {
                console.error('Share and clipboard failed:', clipboardError);
            }

        }
    }
    
    let deferredInstallPrompt = null;

    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();

        deferredInstallPrompt = event;

        installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) {
            return;
        }

        deferredInstallPrompt.prompt();

        try {
            await deferredInstallPrompt.userChoice;
        } catch (error) {
            console.error('Install prompt failed:', error);
        }

        deferredInstallPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
        installBanner.style.display = 'none';
        deferredInstallPrompt = null;
    });


    /* Service Worker */

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    
    creditCloseBtn.addEventListener('click', () => {
        creditModal.style.display = 'none';
    });

    creditLinkCloseBtn.addEventListener('click', () => {
        creditLinkModal.style.display = 'none';
    });
    
    function showCredits() {
        const tracks = window.trackTimestamps;
        const songStarts = tracks.map(track => track.time);
        const currentTime = audio.currentTime;

        let currentIndex = -1;

        for (let i = 0; i < songStarts.length; i++) {
            const parts = songStarts[i].split(':').map(Number);
            const timestamp = parts.length === 3
                ? parts[0] * 3600 + parts[1] * 60 + parts[2]
                : parts[0] * 60 + parts[1];

            if (timestamp <= currentTime) {
                currentIndex = i;
            }
        }

        if (currentIndex < 0) {
            currentIndex = 0;
        }

        const currentTrack = tracks[currentIndex];

        if (!currentTrack.creditText) {
            alert("No credits associated with the current track.");
            return;
        }

        const creditText = "Current track credit(s):\n" + currentTrack.creditText;

        if (!currentTrack.creditLink) {
            creditModalText.textContent = creditText;
            creditModal.style.display = 'flex';
            return;
        }

        creditOpenBtn.href = currentTrack.creditLink;
        creditLinkModalText.textContent = `${creditText}\n\nUse "Open" to go to the website, creator's profile or original content.`;
        creditLinkModal.style.display = 'flex';
    }

});
    
</script>
    
</body>
</html>
