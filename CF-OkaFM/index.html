<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="google" content="notranslate">
<link rel="icon" type="image/png" href="/favicon-512.png">
<title>Oka FM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#fff}
.page{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:min(256px,80vw);height:auto;display:block}
.continue-button{margin-top:28px;padding:13px 42px;background:#171A21;color:#fff;border:none;border-radius:999px;font-family:Arial,sans-serif;font-size:26px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;outline:none}
.continue-button:hover,.continue-button:focus,.continue-button:active{background:#171A21;color:#fff;text-decoration:none;outline:none;box-shadow:none}
.continue-button,
.continue-button:hover,
.continue-button:focus,
.continue-button:focus-visible,
.continue-button:active {
    background:#171A21;
    color:#fff;
    outline:none;
    box-shadow:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
}
</style>
</head>
<body>
<div class="page">
<img class="logo" src="favicon-512.png" alt="Oka FM">
<a class="continue-button" href="audio-content.html">Continue</a>
</div>
</body>
</html>
